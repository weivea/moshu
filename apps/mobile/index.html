<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!--
			Bundled-app CSP. The UI is served locally by the WebView (capacitor://localhost); it is never
			loaded from a remote origin. The authenticated Agent Server socket is opened by the native
			transport plugin (URLSessionWebSocketTask), not by JS, so `connect-src` does not need the Dev
			Tunnel origin. `style-src 'unsafe-inline'` is required by HeroUI's runtime styles.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'"
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="color-scheme" content="light dark" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<title>墨枢 Moshu</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
